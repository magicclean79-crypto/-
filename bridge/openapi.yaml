# CTO Bridge — ChatGPT Actions 연결용 명세
#
# ChatGPT 커스텀 GPT의 "Actions"에 이 파일을 그대로 붙이면 ChatGPT가
# Bridge를 호출할 수 있다.
#
# **전제**: ChatGPT(웹)는 사용자의 PC(사설망 192.168.x.x)에 직접 닿지
# 못한다. 아래 `servers.url`을 **공개 주소로 바꿔야** 한다 —
# 터널(ngrok·cloudflared) 또는 이미 접속 가능한 EC2 등.
# 자세한 것은 bridge/README.md "ChatGPT 연결" 절 참고.
#
# **응답 구조는 components/schemas 에 모아 두었다.** ChatGPT Actions는
# components 안에 schemas 가 객체로 있을 것을 요구한다 — 없으면
# "schemas subsection is not an object" 로 등록을 거부한다(실측, 2026-08-09).

openapi: 3.1.0
info:
  title: CTO Bridge
  description: |
    ChatGPT(총괄)가 Claude Code(실행자)에게 작업을 전달하고 결과를 받는 통로.

    쓰는 순서:
      1. listTasks 로 현재 상태를 본다
      2. createTask 로 새 작업을 지시한다 (상태 REQUESTED)
      3. runNextTask 로 실행을 **시작**한다 — 곧바로 202로 돌아온다
      4. 잠시 뒤 getTask 로 상태를 확인한다. 아직 IN_PROGRESS 면 더 기다렸다
         다시 물어본다. READY_FOR_REVIEW 가 되면 결과를 읽는다

    **실행은 기다리지 않는다.** Claude Code 한 번 호출은 수 분에서 수십 분이
    걸린다. runNextTask 는 작업을 시작만 하고 즉시 응답한다. 응답이 왔다고
    작업이 끝난 것이 아니다 — 끝났는지는 반드시 getTask 로 확인한다.
    사용자에게 "완료됐다"고 말하기 전에 상태가 READY_FOR_REVIEW 인지 본다.

    작업 상태는 REQUESTED → IN_PROGRESS → TESTING → READY_FOR_REVIEW → COMPLETED
    이며 건너뛸 수 없다. needsHumanDecision 이 true 면 사람이 브라우저에서
    확인해야 하므로 다음 작업을 밀어 넣지 말고 사용자에게 알린다. 진행 중
    막다른 결정이 필요하면 상태가 BLOCKED 가 된다 — decisionNeeded 에 무엇을
    정해야 하는지 적혀 있으니 그것을 사람에게 그대로 전달한다.

    작업이 IN_PROGRESS 나 TESTING 에서 오래 멈춰 있으면 resetTask 로 대기열에
    되돌린 뒤 다시 실행한다.

    ## 여러 프로젝트 (2026-08-09)

    이 Bridge는 **하나의 저장소에 묶여 있지 않다.** registerProject 로 새
    프로젝트(저장소 경로·공식 문서·건드리면 안 되는 것·검증 명령)를 등록하면,
    그 뒤로는 모든 호출에 `project` 쿼리 파라미터를 붙여 **그 프로젝트의
    저장소·문서·작업만** 대상으로 삼을 수 있다. `project` 를 생략하면
    처음부터 있던 기본 프로젝트(acos)를 그대로 쓴다 — 기존 대화가 계속
    동작하는 이유다.

    새 프로젝트를 시작하는 순서:
      1. registerProject 로 등록한다 (저장소 경로가 실제로 있어야 한다)
      2. createTask 를 `project=<새ID>` 로 호출해 그 프로젝트에 작업을 만든다
      3. runNextTask 도 같은 `project` 로 호출한다 — 다른 프로젝트를
         건드리지 않는다
  version: 1.1.0

servers:
  # **여기에 실제 주소를 적어 두지 않는다.**
  # cloudflared 임시 주소는 터널을 띄울 때마다 바뀌는 환경 종속 값이라
  # 저장소에 남기면 죽은 주소를 믿게 된다(사장님 결정, 2026-08-09).
  #
  # 실제 주소가 채워진 파일은 start-bridge.ps1 이 만든다:
  #   bridge/openapi.live.yaml   ← ChatGPT Actions 에는 이 파일을 붙여넣는다
  # 그 파일과 bridge/tunnel-url.txt 는 .gitignore 로 막혀 있다.
  - url: https://CHANGE-ME.trycloudflare.com
    description: cloudflared 임시 터널 (재시작 시 주소 변경)

paths:
  /health:
    get:
      operationId: health
      summary: Bridge가 살아 있는지 확인한다
      security: []
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /projects:
    get:
      operationId: listProjects
      summary: 등록된 프로젝트 전부를 본다
      description: |
        기본 프로젝트(acos)는 등록하지 않아도 항상 포함된다. 새 프로젝트를
        다루기 전에 먼저 여기서 이미 등록돼 있는지 확인한다 — 같은
        projectId로 두 번 등록하면 registerProject가 거부한다.
      responses:
        "200":
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: registerProject
      summary: 새 프로젝트를 등록한다
      description: |
        이후 이 projectId로 부르는 모든 호출(createTask·runNextTask·getTask
        등)은 **이 프로젝트의 저장소·문서·건드리면 안 되는 것·검증 명령만**
        대상으로 삼는다. 다른 프로젝트의 작업·결과와 섞이지 않는다.

        repoPath는 Bridge를 실행 중인 PC에 **실제로 있는 폴더**여야 한다 —
        없으면 지금 바로 거부되고, runNextTask를 부를 때가 되어서야
        실패하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProjectRequest"
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterProjectResponse"
        "400":
          description: 잘못된 요청 (ID 형식·중복 등록·없는 저장소 경로 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: 프로젝트 하나의 등록 정보를 본다
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 등록 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProjectResponse"
        "404":
          description: 등록되지 않은 프로젝트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tasks:
    get:
      operationId: listTasks
      summary: 한 프로젝트의 모든 작업 현재 상태를 가져온다
      parameters:
        - $ref: "#/components/parameters/ProjectQuery"
      responses:
        "200":
          description: 작업 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          description: 인증 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTask
      summary: 새 작업을 지시한다
      parameters:
        - $ref: "#/components/parameters/ProjectQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          description: 잘못된 요청 (등록되지 않은 프로젝트 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: 작업 하나의 지시와 결과를 가져온다
      parameters:
        - name: taskId
          in: path
          required: true
          description: "작업 식별자 (예: T1-21)"
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectQuery"
      responses:
        "200":
          description: 작업 지시와 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          description: 없는 작업
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tasks/{taskId}/reset:
    post:
      operationId: resetTask
      summary: 멈춘 작업을 대기열(REQUESTED)로 되돌린다
      description: |
        IN_PROGRESS에 갇힌 작업(실행 프로세스가 죽음)이나 TESTING에 멈춘
        작업(검증 기록이 게이트를 통과하지 못함)을 다시 실행할 수 있게 만든다.
        COMPLETED는 되돌리지 않는다.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: 되돌림
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "400":
          description: 되돌릴 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 없는 작업
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /run:
    post:
      operationId: runNextTask
      summary: REQUESTED 작업 하나의 실행을 시작한다 (즉시 응답)
      description: |
        Claude Code를 헤드리스로 호출해 작업을 수행한다.
        **실제 비용이 발생한다.**

        이 호출은 **작업이 끝나기를 기다리지 않는다.** 실행을 시작하고
        곧바로 202로 돌아온다 — 수십 분짜리 작업을 HTTP 응답으로 붙잡고
        있으면 중간 경로가 먼저 끊기기 때문이다(Cloudflare 524).

        202를 받았다면 작업은 **뒤에서 계속 돌고 있다.** 응답의 taskId로
        getTask 를 주기적으로 불러 상태를 확인한다. 완료되면 상태가
        READY_FOR_REVIEW로 올라가며, 검증 기록이 부족하면 TESTING에 머문다.
      parameters:
        - $ref: "#/components/parameters/ProjectQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: 실행을 시작했다 (아직 끝나지 않았다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "200":
          description: 시작하지 않았다 (실행할 작업이 없거나 dryRun)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          description: 실행할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs:
    get:
      operationId: listRuns
      summary: 지금 돌고 있는 실행을 본다
      responses:
        "200":
          description: 실행 중 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunningList"

  /recover:
    post:
      operationId: recoverRuns
      summary: 중단된 실행 전부를 대기열로 되돌린다
      description: |
        서버나 PC가 꺼지면 실행 중이던 작업은 IN_PROGRESS에 갇힌다.
        이 호출은 그런 작업을 찾아 REQUESTED로 되돌린다. 살아 있는 실행은
        건드리지 않는다.
      responses:
        "200":
          description: 되돌린 작업 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverResult"

  /status:
    get:
      operationId: getStatus
      summary: 사람이 읽는 현재 상태 요약(마크다운)
      parameters:
        - $ref: "#/components/parameters/ProjectQuery"
      responses:
        "200":
          description: STATUS.md 원문
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    # 어느 프로젝트의 요청인지. 생략하면 기본 프로젝트(acos)다 —
    # 프로젝트를 몰랐던 예전 호출이 그대로 동작하도록 두었다.
    ProjectQuery:
      name: project
      in: query
      required: false
      description: 대상 프로젝트 ID. 생략하면 기본 프로젝트
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ProjectQuery:
      name: project
      in: query
      required: false
      description: |
        대상 프로젝트 ID. 생략하면 처음부터 있던 기본 프로젝트(acos)를
        쓴다 — 프로젝트를 몰랐던 예전 호출이 그대로 동작하는 이유다.
        registerProject로 등록한 ID만 쓸 수 있다.
      schema:
        type: string

  schemas:
    Health:
      type: object
      description: 살아 있는지와 인증이 켜져 있는지만 알린다
      properties:
        ok:
          type: boolean
        authRequired:
          type: boolean
          description: 인증이 켜져 있는지

    TaskState:
      type: string
      description: |
        작업 단계. 건너뛸 수 없다. BLOCKED는 진행 단계가 아니라 옆으로
        빠지는 자리다 — 사람의 결정이 반드시 필요할 때만 들어간다.
      enum:
        - REQUESTED
        - IN_PROGRESS
        - TESTING
        - READY_FOR_REVIEW
        - COMPLETED
        - BLOCKED

    TaskSummary:
      type: object
      description: 목록에 보이는 작업 한 건의 요약
      properties:
        taskId:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/TaskState"
        projectId:
          type: string
          description: 이 작업이 속한 프로젝트. 지정 없이 만들었으면 기본 프로젝트(acos)
        costIncurred:
          type: boolean
          description: 실제 비용이 발생했는지
        needsHumanDecision:
          type: boolean
          description: true면 사람이 브라우저에서 확인해야 한다
        browserUrl:
          type: string
          description: 사람이 결과를 확인할 주소. 없으면 null
        blockedOn:
          type: string
          description: 막혀 있다면 그 이유. 없으면 null
        decisionNeeded:
          type: array
          description: |
            state가 BLOCKED일 때만 채워진다. 사장님이 무엇을 정해야 하는지
            그대로 전달한다. 다음 작업을 밀어 넣지 말고 사용자에게 알린다.
          items:
            $ref: "#/components/schemas/Decision"
        testsPassed:
          type: object
          description: build·typecheck·lint·tests 결과. 없으면 null
          additionalProperties:
            type: string
        runId:
          type: string
          description: 지금 돌고 있는 실행의 식별자. 실행 중이 아니면 null
        startedAt:
          type: string
          description: 실행을 시작한 시각. 없으면 null
        heartbeatAt:
          type: string
          description: 마지막으로 살아 있다고 알린 시각. 오래 멈춰 있으면 실행이 죽은 것이다
        finishedAt:
          type: string
          description: 실행이 끝난 시각. 아직 돌고 있으면 null

    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"

    TaskRequest:
      type: object
      description: ChatGPT가 내린 작업 지시
      properties:
        taskId:
          type: string
        projectId:
          type: string
          description: 이 작업이 속한 프로젝트
        title:
          type: string
        request:
          type: string
        requestedBy:
          type: string
        state:
          $ref: "#/components/schemas/TaskState"
        createdAt:
          type: string

    TaskResult:
      type: object
      description: Claude Code가 수행한 결과. 아직 없으면 null
      properties:
        taskId:
          type: string
        projectId:
          type: string
          description: 이 결과가 속한 프로젝트
        state:
          $ref: "#/components/schemas/TaskState"
        decisionNeeded:
          type: array
          description: state가 BLOCKED일 때만 채워진다. 사람에게 그대로 전달한다
          items:
            type: object
            properties:
              question:
                type: string
              options:
                type: array
                items:
                  type: string
              why:
                type: string
                description: 실행자가 왜 스스로 정할 수 없었는지
        workDone:
          type: array
          items:
            type: string
        changedFiles:
          type: array
          items:
            type: string
        testResults:
          type: object
          description: |
            build·typecheck·lint·tests 결과. 각 값은 {ok, detail} 객체이거나
            (옛 기록은) 문자열이다. ok 가 false 인 검사가 있으면
            READY_FOR_REVIEW 로 올라가지 못한다.
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
        errorsAndFixes:
          type: array
          items:
            type: string
        costIncurred:
          type: boolean
        costDetail:
          type: string
          description: 비용 내역. 없으면 null
        actualResult:
          type: string
          description: 실제 실행 결과. 없으면 null
        browserUrl:
          type: string
          description: 사람이 결과를 확인할 주소. 없으면 null
        userChecks:
          type: array
          items:
            type: string
        blockedOn:
          type: string
          description: 막혀 있다면 그 이유. 없으면 null
        nextTasks:
          type: array
          items:
            type: string
        runId:
          type: string
          description: 실행 식별자. 실행 중이 아니면 null
        startedAt:
          type: string
        heartbeatAt:
          type: string
          description: 마지막으로 살아 있다고 알린 시각
        finishedAt:
          type: string
          description: 실행이 끝난 시각. 아직 돌고 있으면 null

    TaskDetail:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskRequest"
        result:
          $ref: "#/components/schemas/TaskResult"

    CreateTaskRequest:
      type: object
      required:
        - taskId
        - title
        - request
      properties:
        taskId:
          type: string
          description: "작업 식별자 (예: T1-27)"
        title:
          type: string
        request:
          type: string
          description: 무엇을 해야 하는지. Claude Code가 그대로 읽는다
        projectId:
          type: string
          description: |
            대상 프로젝트. 생략하면 project 쿼리 파라미터를, 그것도 없으면
            기본 프로젝트(acos)를 쓴다. registerProject로 먼저 등록해야 한다.

    CreateTaskResponse:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskRequest"

    RunRequest:
      type: object
      properties:
        taskId:
          type: string
          description: 실행할 작업을 지정한다. 주지 않으면 대기열의 첫 작업을 집는다
        projectId:
          type: string
          description: |
            실행할 프로젝트. 생략하면 project 쿼리 파라미터를, 그것도 없으면
            기본 프로젝트(acos)를 쓴다. 이 프로젝트의 repoPath가 실제
            작업 폴더가 된다 — 다른 프로젝트를 건드리지 않는다.
        cwd:
          type: string
          description: 저장소 경로
        browserUrl:
          type: string
          description: 사람이 결과를 확인할 주소
        userChecks:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
          description: true면 프롬프트만 만들고 실제 호출은 하지 않는다

    RunAccepted:
      type: object
      description: |
        실행을 시작했다는 접수증이다. **결과가 아니다.**
        accepted 가 true면 작업은 뒤에서 계속 돌고 있다 — taskId로 조회한다.
      properties:
        ran:
          type: boolean
          description: 실행을 시작했는지
        accepted:
          type: boolean
          description: true면 백그라운드에서 돌고 있다. 결과는 getTask로 확인한다
        taskId:
          type: string
          description: 실행을 시작한 작업. 없으면 null
        runId:
          type: string
          description: 이번 실행의 식별자
        state:
          $ref: "#/components/schemas/TaskState"
        startedAt:
          type: string
        pollWith:
          type: string
          description: 상태를 어떻게 조회하는지 알려 준다
        note:
          type: string
          description: 응답을 기다리지 말라는 안내
        reason:
          type: string
          description: 시작하지 않았다면 그 이유. 없으면 null
        recovered:
          type: array
          description: 이번에 대기열로 되돌린 중단된 작업들
          items:
            $ref: "#/components/schemas/Recovered"
        running:
          type: array
          description: 지금 돌고 있는 실행
          items:
            $ref: "#/components/schemas/Running"
        dryRun:
          type: boolean
          description: 실제 호출 없이 프롬프트만 만들었는지
        prompt:
          type: string
          description: dryRun 일 때만 들어 있는, Claude Code에 보낼 프롬프트 원문

    Running:
      type: object
      properties:
        runId:
          type: string
        taskId:
          type: string
        startedAt:
          type: string

    RunningList:
      type: object
      properties:
        running:
          type: array
          items:
            $ref: "#/components/schemas/Running"

    Recovered:
      type: object
      properties:
        taskId:
          type: string
        reason:
          type: string
          description: 왜 중단된 것으로 판단했는지

    RecoverResult:
      type: object
      properties:
        recovered:
          type: array
          items:
            $ref: "#/components/schemas/Recovered"

    ResetRequest:
      type: object
      properties:
        reason:
          type: string
          description: 왜 되돌리는지. 기록으로 남는다

    ResetResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/TaskResult"

    Decision:
      type: object
      description: 사람이 정해 줘야 진행되는 것 하나
      properties:
        question:
          type: string
          description: 무엇을 정해야 하는지
        options:
          type: array
          items:
            type: string
        why:
          type: string
          description: 실행자가 왜 스스로 정할 수 없었는지

    CheckResult:
      type: object
      description: 검사 하나의 결과. 통과 여부는 글로 짐작하지 말고 ok 로 읽는다
      properties:
        ok:
          type: boolean
          description: 이번 변경분이 통과했는지. 기존 문제는 여기에 반영하지 않는다
        detail:
          type: string
          description: 실제로 무엇을 돌렸고 어떤 숫자가 나왔는지

    Error:
      type: object
      properties:
        error:
          type: string

    ProjectSummary:
      type: object
      description: 등록된 프로젝트 하나의 정보
      properties:
        projectId:
          type: string
        name:
          type: string
        repoPath:
          type: string
          description: Bridge를 실행 중인 PC에서 이 프로젝트의 저장소 위치
        docs:
          type: array
          description: 실행자가 작업 전에 먼저 읽을 문서 (저장소 기준 상대 경로)
          items:
            type: string
        doNotTouch:
          type: array
          description: 사람 승인 없이 고치면 안 되는 것
          items:
            type: string
        verifyCommands:
          type: array
          description: 구현 후 실제로 돌릴 검증 명령
          items:
            type: string
        requiredChecks:
          type: array
          description: |
            사람 확인 단계로 올리려면 반드시 기록돼야 할 검사 이름.
            생략하면 build·typecheck·lint·tests. 빈 배열이면 기본값으로
            돌아간다 — 게이트를 없앨 수는 없다.
          items:
            type: string
        browserUrl:
          type: string
          description: 사람이 결과를 확인할 기본 주소. 없으면 null
        scope:
          type: string
          description: 이 프로젝트에서 스스로 정해도 되는 범위. 없으면 null
        createdAt:
          type: string

    ProjectList:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"

    RegisterProjectRequest:
      type: object
      required:
        - projectId
        - name
        - repoPath
      properties:
        projectId:
          type: string
          description: "소문자·숫자·하이픈, 40자 이내. 이후 project 파라미터로 쓴다 (예: demo-widget)"
        name:
          type: string
        repoPath:
          type: string
          description: Bridge를 실행 중인 PC에 실제로 있어야 하는 폴더. 없으면 등록이 거부된다
        docs:
          type: array
          items:
            type: string
        doNotTouch:
          type: array
          items:
            type: string
        verifyCommands:
          type: array
          items:
            type: string
        requiredChecks:
          type: array
          items:
            type: string
        browserUrl:
          type: string
        scope:
          type: string

    RegisterProjectResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/ProjectSummary"

    GetProjectResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/ProjectSummary"

security:
  - bearerAuth: []
