# CI. (TASK-2101, Sprint 21 — TASK-3401 운영 검증 · TASK-3601 Job 분리)
#
# 품질 게이트와 **Major Migration 교차 검증**(CTO 결정 2001-③)을 돌린다.
# 교차 검증은 build 뒤에 둔다 — 검증 로직이 `@acos/core`에 있고, 순수 로직은
# 한 곳에만 둔다는 규칙을 스크립트에서도 지키기 때문이다.
#
# TASK-3601 (CTO 정책 3601-④)에서 나눈 것: **Core/API와 Web e2e를 병렬 Job**
# 으로 분리한다. 한 Job이 4분을 쓰던 구조에서는 e2e가 늘 때마다 모든 게이트의
# 답이 늦어졌고, 게이트가 느려지면 사람은 게이트를 안 기다린다.
# 두 Job은 서로를 기다리지 않는다 — 어느 쪽이 깨졌는지도 색으로 바로 갈린다.
#
# TASK-3501 (CTO 지시 4)에서 더한 것:
# 동시 실행 취소 · 작업 시간 상한 · 최소 권한 · **게이트 자체 검증 단계**.
#
# TASK-3401 (CTO 지시 6)에서 고친 것:
#
# 1. **Playwright 브라우저를 설치한다.** `pnpm test`에는 web e2e가 들어 있고,
#    러너에는 브라우저가 없다. 그래서 이 워크플로는 한때 **13회 실행이 전부
#    실패**했다 — 게이트가 파일에 적혀 있었지만 한 번도 초록인 적이 없었다.
#    로컬에서만 통과하는 게이트는 게이트가 아니다.
# 2. **TypeScript 게이트를 추가한다.** CTO가 매 TASK 요구하는 게이트인데
#    워크플로에는 없었다 — 사람이 로컬에서 돌리는 것에만 의존하고 있었다.
# 3. **Node 22.** 러너가 Node 20을 폐기 예정으로 경고하고 있었다.
#
# TASK-4701 (Sprint 47, CTO 지시 4)에서 더한 것: **live-checks Job.**
#
# 지금까지 여기서 Live Verification을 하나도 돌리지 않았고, 그 대가를
# TASK-4603에서 치렀다 — 라이브 결함 4건이 나왔는데 **넷 다 유닛 테스트를
# 통과한 것들**이었다. 인메모리 mock은 우리가 상상한 대로 동작하고 실제 DB는
# 우리가 쓴 대로 동작한다.
#
# 그래서 **자격 증명이 필요 없는 것만** 여기로 옮긴다: 실 PostgreSQL(서비스
# 컨테이너) + 우리 계약 스텁. 무엇이 옮겨지고 무엇이 남는지는 사람이 문장으로
# 정하지 않는다 — `@acos/core`의 `judgeCiCoverage`가 판정하고
# `pnpm check:live-coverage`가 출력한다.
#
# 여기서 **여전히** 돌리지 않는 것: 실 Provider 호출(자격 증명·과금),
# 운영 저장소, 그리고 사람이 눈으로 읽어야 하는 화면 문장.
#
# 그리고 가장 중요한 것: **이 Job이 초록이라고 Live Verification이 끝난 것이
# 아니다.** 여기서 증명하는 것은 배선이 맞는가이고, 실제 Provider가 우리
# 요청을 어떻게 대하는지는 증명하지 않는다.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 앞선 실행을 접는다 (TASK-3501, CTO 지시 4).
# 접지 않으면 러너가 옛 커밋을 붙들고 있고, 그동안 최신 커밋의 결과를
# 아무도 못 본다 — 게이트가 느려지면 사람은 게이트를 안 기다린다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 — 이 워크플로는 코드를 읽기만 한다
permissions:
  contents: read

jobs:
  # 정적 게이트 + Core/API 테스트 — 브라우저가 필요 없다
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 매니페스트와 `_major_` 파일명 규칙이 어긋나면 막는다.
      # 지정이 조용히 사라지면 대규모 변경 후에도 리허설이 요구되지 않는다.
      - name: Major Migration 교차 검증
        run: pnpm check:major-migrations

      # 게이트가 게이트를 검증한다 (TASK-3501, CTO 지시 4).
      # 워크플로에서 게이트 한 줄이 사라져도 CI는 여전히 초록으로 끝난다 —
      # 없어진 검사는 실패하지 않기 때문이다.
      - name: 품질 게이트 자체 검증
        run: pnpm check:ci-gates

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Core · API)
        run: pnpm test:unit

  # Web e2e — 브라우저가 필요하고 가장 오래 걸린다 (TASK-3601, 정책 3601-④)
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 브라우저가 없으면 e2e가 통째로 죽고, 그 실패는 "코드가 잘못됐다"로
      # 읽힌다 — 실제로는 환경이 준비되지 않은 것이다.
      - name: Playwright 브라우저 설치
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Test (Web e2e)
        run: pnpm test:e2e

  # 라이브 검사 — 자격 증명이 필요 없는 것만 (TASK-4701, CTO 지시 4)
  live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acos
        ports:
          - 5432:5432
        # 준비되기 전에 붙으면 "DB가 죽었다"가 아니라 "아직 안 떴다"인데,
        # 실패 메시지는 그 둘을 구별해 주지 않는다.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acos
      # 실 Provider를 부르지 않는다 — 자격 증명도 과금도 없다
      LLM_PROVIDER: mock
      OCR_PROVIDER: google-vision
      GOOGLE_VISION_API_KEY: ci-stub-key
      GOOGLE_VISION_ENDPOINT: http://127.0.0.1:9100/v1/images:annotate
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: acos
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://127.0.0.1:9000/acos
      AUTH_ADMIN_EMAIL: admin@acos.local
      AUTH_ADMIN_PASSWORD: admin1234
      # 자동 이어하기는 기본이 꺼짐이다 — 검사에서만 켠다
      JOB_AUTO_RESUME: "on"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 무엇이 CI에서 돌고 무엇이 사람 몫인지 먼저 출력한다 —
      # 이 Job이 전부를 덮는다고 읽히면 안 된다.
      - name: 라이브 검증 CI 적용 범위
        run: pnpm check:live-coverage

      - name: 마이그레이션
        run: pnpm --filter api exec prisma migrate deploy

      # 둘 다 **뜰 때까지 기다립니다.** 첫 실행에서 s3rver가 아직 내려받는
      # 중인데 씨앗이 먼저 돌아 실패했습니다 — 그 실패는 "코드가 잘못됐다"로
      # 읽히지만 실제로는 준비가 안 된 것이었습니다.
      #
      # s3rver의 루트 경로는 응답하지 않으므로 **버킷 경로**를 봅니다.
      # 상태 코드는 보지 않습니다 — 404라도 누군가 듣고 있다는 뜻이고,
      # 여기서 알고 싶은 것은 그것뿐입니다.
      - name: 계약 스텁 (Vision · S3)
        run: |
          mkdir -p /tmp/s3
          node scripts/ci-vision-stub.mjs > /tmp/vision-stub.log 2>&1 &
          npx --yes s3rver -d /tmp/s3 -p 9000 --address 127.0.0.1 > /tmp/s3.log 2>&1 &
          node scripts/wait-for.mjs http://127.0.0.1:9100/__mode 60
          node scripts/wait-for.mjs http://127.0.0.1:9000/acos 120

      - name: 씨앗
        run: node scripts/seed-live-checks.mjs

      - name: API 기동
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          node scripts/wait-for.mjs http://127.0.0.1:4000/health 60

      - name: 라이브 검사
        env:
          VISION_STUB_CONTROL: http://127.0.0.1:9100
        run: pnpm live:checks

      # 실패했을 때 로그가 없으면 "왜 빨간지"를 아무도 못 찾는다.
      - name: 실패 시 로그
        if: failure()
        run: |
          echo "--- api ---"; tail -200 /tmp/api.log || true
          echo "--- vision stub ---"; tail -50 /tmp/vision-stub.log || true
          echo "--- s3 ---"; tail -50 /tmp/s3.log || true
