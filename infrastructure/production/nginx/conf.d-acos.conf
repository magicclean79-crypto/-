# ACOS Production reverse proxy — Web(3000) + API(4000)
# T1-210 (2026-09-04). TLS는 DNS(magicclean79.com 계열 A레코드)와
# 보안그룹(80/443 인바운드) 설정 후 certbot --nginx 로 추가한다.

server {
    server_name magicclean79.com www.magicclean79.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/magicclean79.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/magicclean79.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name api.magicclean79.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/magicclean79.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/magicclean79.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = www.magicclean79.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = magicclean79.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name magicclean79.com www.magicclean79.com;
    return 404; # managed by Certbot




}

server {
    if ($host = api.magicclean79.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.magicclean79.com;
    return 404; # managed by Certbot


}